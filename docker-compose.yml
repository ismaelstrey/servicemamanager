
services:
  postgres:
    image: postgres:16-alpine
    container_name: telecomai-postgres
    init: true
    restart: unless-stopped
    environment:
      # Variáveis do banco (podem vir do .env). Defaults entre chaves são usados se não houver .env.
      POSTGRES_DB: ${POSTGRES_DB:-telecomai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: telecomai-redis
    init: true
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-localdevredis}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localdevredis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telecomai-backend
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-4002}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-telecomai}?schema=public
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdevredis}
      # Storage S3/MinIO (opcional)
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # Endpoint público para gerar URLs acessíveis pelo host
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-4002}:4002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Worker BullMQ (placeholder até implementar processamento)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telecomai-worker
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdevredis}
    depends_on:
      redis:
        condition: service_healthy
    command: ["sh", "-c", "echo 'Worker BullMQ placeholder ativo' && sleep infinity"]

  # MinIO (S3 compatível) — opcional
  minio:
    image: minio/minio:latest
    container_name: telecomai-minio
    init: true
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Inicialização do MinIO: cria bucket, aplica política pública de download e CORS
  minio-init:
    image: minio/mc:latest
    container_name: telecomai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - ./minio-cors.json:/cors.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set myminio ${S3_ENDPOINT} ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
       mc mb --ignore-existing myminio/${S3_BUCKET} &&
       mc anonymous set download myminio/${S3_BUCKET} &&
       mc cors set myminio/${S3_BUCKET} /cors.json &&
       echo 'MinIO bucket initialized with public download and CORS'"

volumes:
  postgres_data:
  redis_data:
  minio_data: