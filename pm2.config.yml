apps:
  - name: telecomai-backend
    cwd: ./backend
    script: dist/server.js
    interpreter: node
    instances: 1
    autorestart: true
    watch: false
    max_memory_restart: 300M
    env:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telecomai?schema=public
      JWT_SECRET: change-me-production
  # Optional: only enable after frontend build
  # - name: telecomai-frontend
  #   cwd: ./frontend
  #   script: node_modules/.bin/vite
  #   args: preview --port 5173
  #   interpreter: node
  #   env:
  #     NODE_ENV: production